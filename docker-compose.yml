services:
  db:
    image: postgres:17
    container_name: drivesafe-db
    environment:
      POSTGRES_USER: drivesafe
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: drivesafe
    ports:
      - "5432:5432"
    volumes:
      - drivesafe-data:/var/lib/postgresql/data

volumes:
  drivesafe-data: